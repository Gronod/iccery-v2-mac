name: macOS CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'milestone/m6-gamut-stage0-cgats-release'

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Argyll sidecars
        run: scripts/fetch-argyll.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Generate Xcode project
        run: xcodegen generate --project .

      - name: Build and test (universal)
        run: |
          xcodebuild test \
            -scheme ICCery \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

  package:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/milestone/m6-gamut-stage0-cgats-release' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: scripts/package-release.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: iccery-dmg
          path: ICCery-*.dmg
