name: macOS CI

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    # Prefer a self-hosted Mac runner if your Gitea has one. If not,
    # macos-14 works for this pipeline.
    runs-on: macos-14
    env:
      DERIVED: build/DerivedData-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for testing (universal)
        run: |
          xcodebuild build-for-testing \
            -scheme ICCery \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED" \
            -configuration Debug \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='-'

      - name: Test (universal)
        run: |
          XCTESTRUN="$(find "$DERIVED" -name 'ICCery*.xctestrun' | head -n 1)"
          if [ -z "$XCTESTRUN" ] || [ ! -f "$XCTESTRUN" ]; then
            echo "error: no xctestrun produced by build-for-testing" >&2
            exit 1
          fi
          echo "xctestrun: $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED"

  package:
    needs: build-and-test
    runs-on: macos-14
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: scripts/package-release.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v3
        with:
          name: iccery-dmg
          path: ICCery-*.dmg
