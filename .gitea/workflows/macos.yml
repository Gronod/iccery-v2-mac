name: macOS CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Argyll sidecars
        run: scripts/fetch-argyll.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Generate Xcode project
        run: xcodegen generate --project .

      - name: Build and test (universal)
        run: |
          xcodebuild build-for-testing \
            -scheme ICCery \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=YES

          BUILT_PRODUCTS_DIR="$(xcodebuild -scheme ICCery -destination 'platform=macOS' -showBuildSettings | sed -n 's/^ *BUILT_PRODUCTS_DIR = //p' | head -n 1)"
          if [ -d "$BUILT_PRODUCTS_DIR/ICCery.app" ]; then
            xattr -cr "$BUILT_PRODUCTS_DIR/ICCery.app"
            codesign -f -s - --options runtime "$BUILT_PRODUCTS_DIR/ICCery.app"
          fi
          for runner in "$BUILT_PRODUCTS_DIR"/*Runner.app; do
            if [ -d "$runner" ]; then
              xattr -cr "$runner"
              codesign -f -s - --options runtime "$runner"
            fi
          done

          xcodebuild test \
            -scheme ICCery \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=YES

  package:
    needs: build-and-test
    runs-on: macos-14
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: scripts/package-release.sh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v3
        with:
          name: iccery-dmg
          path: ICCery-*.dmg
